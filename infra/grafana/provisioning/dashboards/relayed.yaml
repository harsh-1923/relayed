# Provisions our dashboards into the LGTM image at startup, so `pnpm services`
# brings them up with the stack rather than leaving them as something to import
# by hand — a dashboard that has to be imported is a dashboard nobody opens.
#
# The JSON is the artifact of record. Edit in Grafana, then export and commit,
# the same direction as SQL → types elsewhere (STACK.md §1).
apiVersion: 1
providers:
  - name: relayed
    orgId: 1
    folder: Relayed
    type: file
    disableDeletion: false
    # Grafana would otherwise refuse edits made in the UI, which makes iterating
    # on a panel impossible without a container restart.
    allowUiUpdates: true
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
