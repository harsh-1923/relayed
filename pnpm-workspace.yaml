packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@google/genai': false
  # Its postinstall reports install telemetry to a vendor endpoint. Denied by
  # name rather than left to the default, so the decision is visible
  # (docs/AGENT-RESPONSES.md, rules for rooms).
  '@openuidev/lang-core': false
  esbuild: true
  protobufjs: false

# pnpm blocks dependency build scripts by default. These two genuinely need
# theirs: esbuild fetches its platform binary, electron downloads the runtime.
# Kept as an explicit allowlist rather than disabling the protection.
onlyBuiltDependencies:
  - esbuild
  - electron
