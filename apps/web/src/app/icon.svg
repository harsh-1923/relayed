  <!-- The HAIL mark reduced to what survives a browser tab. The full lockup is
       public/hail-mark.svg, served at /hail; its ring of letters is set at
       roughly 8px on a 221px artboard, so at a 16px favicon it renders as noise
       around a dot. Same blue, same asterisk, same cream — the ring text is
       dropped and the asterisk scaled up to hold the square on its own.

       Squared off at 226 (the taller of the artboard's two sides) because a
       non-square icon is letterboxed or stretched by the browser, and the
       asterisk is re-centred on that square rather than on the original. -->
