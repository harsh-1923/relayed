# Local development stack for Relayed.
#
#   pnpm services       start everything, wait until healthy
#   pnpm services:down  stop, keep data
#   pnpm services:reset stop and DESTROY all volumes
#   pnpm services:lite  everything except Grafana (~1 GB lighter)
#
# Deliberately host-agnostic: plain Postgres, Redis and an S3-compatible store,
# no managed services. What runs here is what runs in production (docs/DESIGN.md
# §13.9 — the deploy artifact is a long-running container, everywhere).

name: relayed

services:
  postgres:
    image: postgres:18-alpine
    container_name: relayed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: relayed
      POSTGRES_PASSWORD: relayed
      POSTGRES_DB: relayed
      # Deterministic collation. Text index ordering must not depend on the
      # host's locale, or a laptop and a server can disagree about sort order.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8'
    command:
      - postgres
      # Surface slow queries in dev. The welcome query touches ~150 chats
      # (§9.9); we want to see it the moment it regresses.
      - -c
      - log_min_duration_statement=200
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres 18+ wants a single mount at /var/lib/postgresql, NOT at
      # .../data — the image places the cluster in a version-specific
      # subdirectory so `pg_upgrade --link` can work across a major version
      # without crossing a mount boundary. Mounting .../data on 18 fails to
      # start with a confusing "unused mount/volume" message.
      - postgres-data:/var/lib/postgresql
      # *.sql here runs once, on first init only (empty data dir).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relayed -d relayed']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:8-alpine
    container_name: relayed-redis
    restart: unless-stopped
    # No persistence, on purpose. Redis holds only fanout, presence and rate
    # limiting — all of it reconstructible. Losing it costs nothing, because
    # clients recover missed events through cursors and gap markers
    # (docs/DESIGN.md §9.3). If Redis ever holds durable state, that is a bug.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: relayed-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: relayed
      MINIO_ROOT_PASSWORD: relayedsecret
    command: ['server', '/data', '--console-address', ':9001']
    ports:
      - '${MINIO_PORT:-9000}:9000' # S3 API
      - '${MINIO_CONSOLE_PORT:-9001}:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  # One-shot: creates the blob bucket, then exits.
  # `pnpm services` waits on the long-lived containers BY NAME and starts this
  # afterwards — `--wait` can observe a one-shot exiting before slower
  # containers report healthy and treat that as a failure.
  minio-init:
    image: minio/mc:latest
    container_name: relayed-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 relayed relayedsecret &&
        mc mb --ignore-existing local/relayed-blobs &&
        mc anonymous set none local/relayed-blobs &&
        echo "bucket relayed-blobs ready"

  # ─── Observability (opt-in) ────────────────────────────────────────────────
  # Grafana's all-in-one LGTM image: the SAME components as Grafana Cloud —
  # Grafana, Prometheus (stands in for Mimir), Tempo, Loki, Pyroscope, and an
  # OTel Collector. Local dev is therefore representative, and no dev noise
  # burns the Cloud free tier or pollutes production dashboards.
  #
  # In the default profile so `pnpm services` brings the whole stack up in one
  # command. It is the heavy one (~1 GB idle) — `pnpm services:lite` omits it.
  #
  # NOT behind a compose profile, deliberately: a profiled service is skipped by
  # a plain `docker compose down`, which silently leaves a 1 GB container running
  # and blocks network teardown ("Resource is still in use"). Verified.
  #
  #   Grafana      http://localhost:3000   (anonymous admin, no login)
  #   OTLP         :4317 gRPC / :4318 HTTP
  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: relayed-lgtm
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    ports:
      - '${GRAFANA_PORT:-3000}:3000' # Grafana UI
      - '${OTLP_GRPC_PORT:-4317}:4317' # OTLP gRPC   <- SDK exporters
      - '${OTLP_HTTP_PORT:-4318}:4318' # OTLP HTTP
      - '${TEMPO_PORT:-3200}:3200' # Tempo query API
      - '${PROM_PORT:-9090}:9090' # Prometheus query API
    volumes:
      - lgtm-data:/data
      # Dashboards ship with the stack. Read-only mounts: the container may not
      # rewrite what is in git.
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./infra/grafana/provisioning/dashboards/relayed.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/relayed.yaml:ro
    healthcheck:
      # curl, not wget — the image has curl only, and a missing probe binary
      # means the healthcheck never passes and `--wait` hangs until timeout.
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/api/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  postgres-data:
  minio-data:
  lgtm-data:
